[package]
name = "hnsw-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "From-scratch HNSW approximate nearest neighbor index with SIMD distance kernels, filtered search, tombstones and a checksummed file format"
authors = ["Ahmed Semih Özmekik"]
license = "MIT"
repository = "https://github.com/aozmekik/hnsw-index"
readme = "README.md"
keywords = ["hnsw", "ann", "vector-search", "nearest-neighbor", "simd"]
categories = ["algorithms", "data-structures"]
exclude = ["/.github", "/docs/bench", "/scripts"]

# `bench = false` keeps libtest's harness out of `cargo bench`, so Criterion
# flags such as `--save-baseline` reach the Criterion benches only.
[lib]
name = "hnsw_index"
bench = false

[[bin]]
name = "hnsw-bench"
path = "src/bin/hnsw-bench/main.rs"
bench = false

[dependencies]
parking_lot = "0.12.5"
rayon = "1.12.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"

[profile.release]
codegen-units = 1
lto = "thin"

# Integration tests build 10k-vector indexes; keep debug assertions and
# overflow checks but optimize so `cargo test` stays fast.
[profile.test]
opt-level = 3

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Node ids are `u32` by design (see docs/adr/0001); every `usize -> u32`
# conversion is guarded by the `MAX_NODES` capacity check at insertion time.
cast_possible_truncation = "allow"
# Benchmarks and statistics convert counts to floating point on purpose.
cast_precision_loss = "allow"

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "search"
harness = false
